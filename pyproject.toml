[project]
name = "pramaan"
version = "0.1.0"
description = "An open benchmark and verifier for citations to Indian Supreme Court judgments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pymupdf>=1.24",
    "pyarrow>=16.0",
    "pandas>=2.2",
]

[project.scripts]
pramaan = "pramaan.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pramaan"]
